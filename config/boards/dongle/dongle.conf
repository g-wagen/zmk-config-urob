CONFIG_ZMK_KEYBOARD_NAME="KeebMcKeebface Dongle"

# BLE central role
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB HID output
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_HID=y

# No battery on a dongle
CONFIG_ZMK_BATTERY=n